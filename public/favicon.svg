<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <circle cx="50" cy="50" r="42" fill="none" stroke="url(#neonGrad)" stroke-width="6" filter="url(#glow)" />
  <text x="50" y="59" font-family="'Space Grotesk', system-ui, sans-serif" font-weight="bold" font-size="28" fill="url(#neonGrad)" text-anchor="middle" letter-spacing="1">VK</text>
</svg>
